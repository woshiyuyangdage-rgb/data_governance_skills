profiles:
  - profile_name: standard_metadata_template
    enabled: true
    description: 标准化表字段元数据输入
    file_types: [xlsx, csv]
    sheet_candidates: [data, metadata, table_fields]
    required_target_fields:
      - table_name
      - field_name
    optional_target_fields:
      - table_name_cn
      - table_description
      - schema_name
      - system_name
      - field_name_cn
      - field_description
      - data_type
      - nullable
    mapping_spec_name: standard_metadata_spec

  - profile_name: governance_platform_export_template
    enabled: true
    description: 常见治理平台元数据导出
    file_types: [xlsx, csv]
    sheet_candidates: [导出结果, metadata_export, data]
    required_target_fields:
      - table_name
      - field_name
    optional_target_fields:
      - table_name_cn
      - table_description
      - schema_name
      - system_name
      - field_name_cn
      - field_description
      - data_type
      - nullable
    mapping_spec_name: governance_platform_export_spec

  - profile_name: manual_inventory_template
    enabled: true
    description: 手工元数据盘点表
    file_types: [xlsx, csv]
    sheet_candidates: [盘点表, inventory, data]
    required_target_fields:
      - table_name
      - field_name
    optional_target_fields:
      - table_name_cn
      - table_description
      - schema_name
      - system_name
      - field_name_cn
      - field_description
      - data_type
      - nullable
    mapping_spec_name: manual_inventory_spec

  - profile_name: mapping_confirmation_template
    enabled: true
    description: 可提供元数据类字段的映射确认工作簿
    file_types: [xlsx, csv]
    sheet_candidates: [mapping_confirmation, mapping, data]
    required_target_fields:
      - table_name
      - field_name
    optional_target_fields:
      - table_name_cn
      - schema_name
      - system_name
      - field_name_cn
      - field_description
      - data_type
      - nullable
    mapping_spec_name: standard_metadata_spec

  - profile_name: quality_rule_confirmation_template
    enabled: true
    description: 可提供元数据类字段的质量规则确认工作簿
    file_types: [xlsx, csv]
    sheet_candidates: [quality_rule_confirmation, quality_rules, data]
    required_target_fields:
      - table_name
      - field_name
    optional_target_fields:
      - schema_name
      - system_name
      - field_name_cn
      - field_description
      - data_type
      - nullable
    mapping_spec_name: standard_metadata_spec

