variants:
  - variant_name: standard_delivery_bundle
    enabled: true
    description: 标准治理交付包
    included_outputs:
      - mapping_confirmation_workbook
      - stg_confirmation_workbook
      - quality_rule_confirmation_workbook
      - backlog_delivery_workbook
      - governance_delivery_manifest

  - variant_name: business_confirmation_bundle
    enabled: true
    description: 面向业务确认的交付包
    included_outputs:
      - mapping_confirmation_workbook
      - quality_rule_confirmation_workbook
      - governance_delivery_manifest

  - variant_name: architecture_design_bundle
    enabled: true
    description: 面向架构设计的交付包
    included_outputs:
      - stg_confirmation_workbook
      - execution_ready_package
      - governance_delivery_manifest

  - variant_name: quality_rule_build_bundle
    enabled: true
    description: 面向质量规则建设的交付包
    included_outputs:
      - quality_rule_confirmation_workbook
      - execution_ready_package
      - governance_delivery_manifest
