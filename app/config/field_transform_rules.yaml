type_normalization:
  int: integer
  integer: integer
  bigint: bigint
  varchar: string
  char: string
  text: string
  string: string
  decimal: decimal
  numeric: decimal
  datetime: timestamp
  timestamp: timestamp
  date: date
  boolean: boolean
nullable_normalization:
  true_values:
    - true
    - yes
    - y
    - 1
  false_values:
    - false
    - no
    - n
    - 0
reserved_field_actions:
  delete_flag: keep
  batch_no: keep
  etl_time: keep
  sync_time: keep
