profiles:
  - name: run_project_template
    enabled: true
    description: 运行项目模板，并应用工作流、输出、评审和领域默认值
    stages:
      - project_template_apply
      - base_workflow_run
    supports_review_replay: true
    default_report_mode: package

  - name: diagnose_confirmation_template
    enabled: true
    description: 导入前诊断确认工作簿模板
    stages:
      - confirmation_template_diagnosis
    supports_review_replay: false
    default_report_mode: import

  - name: import_confirmation_with_template
    enabled: true
    description: 按模板字段映射导入确认工作簿
    stages:
      - confirmation_template_diagnosis
      - workbook_import
      - roundtrip_merge
    supports_review_replay: false
    default_report_mode: import

  - name: import_confirmation_template_and_rerun
    enabled: true
    description: 导入模板化确认工作簿，并准备变更对象重跑范围
    stages:
      - confirmation_template_diagnosis
      - workbook_import
      - roundtrip_merge
      - changed_object_rerun_scope
    supports_review_replay: false
    default_report_mode: rerun

  - name: metadata_diagnosis_only
    enabled: true
    description: 仅运行元数据诊断
    stages:
      - diagnosis
    supports_review_replay: false
    default_report_mode: diagnosis

  - name: diagnosis_plus_mapping
    enabled: true
    description: 运行元数据诊断和数据标准映射
    stages:
      - diagnosis
      - mapping
    supports_review_replay: false
    default_report_mode: mapping

  - name: diagnosis_mapping_stg
    enabled: true
    description: 运行诊断、标准映射和 STG 建议
    stages:
      - diagnosis
      - mapping
      - stg
    supports_review_replay: false
    default_report_mode: stg

  - name: diagnosis_mapping_stg_with_review
    enabled: true
    description: 运行诊断、映射、STG 建议，并应用评审覆盖
    stages:
      - diagnosis
      - mapping
      - stg
      - review_replay
    supports_review_replay: true
    default_report_mode: confirmed

  - name: diagnosis_mapping_stg_quality
    enabled: true
    description: 运行诊断、映射、STG 建议和质量规则推荐
    stages:
      - diagnosis
      - mapping
      - stg
      - quality_rule_recommendation
    supports_review_replay: false
    default_report_mode: quality

  - name: diagnosis_mapping_stg_quality_with_review
    enabled: true
    description: 运行诊断、映射、STG 建议、质量规则推荐，并应用评审覆盖
    stages:
      - diagnosis
      - mapping
      - stg
      - quality_rule_recommendation
      - review_replay
      - quality_review_replay
    supports_review_replay: true
    default_report_mode: confirmed

  - name: diagnosis_mapping_stg_quality_package
    enabled: true
    description: 运行诊断、映射、STG 建议、质量规则推荐，并构建执行准备包
    stages:
      - diagnosis
      - mapping
      - stg
      - quality_rule_recommendation
      - execution_package_build
    supports_review_replay: false
    default_report_mode: package

  - name: diagnosis_mapping_stg_quality_package_with_review
    enabled: true
    description: 运行诊断、映射、STG、质量评审回放，并构建执行准备包
    stages:
      - diagnosis
      - mapping
      - stg
      - quality_rule_recommendation
      - review_replay
      - quality_review_replay
      - execution_package_build
    supports_review_replay: true
    default_report_mode: package

  - name: governance_readiness_assessment
    enabled: true
    description: 运行质量智能推荐、执行包构建、就绪度评估和缺口分类
    stages:
      - diagnosis
      - mapping
      - stg
      - quality_rule_recommendation
      - execution_package_build
      - readiness_assessment
      - gap_classification
      - remediation_planning
    supports_review_replay: false
    default_report_mode: readiness

  - name: governance_readiness_assessment_with_review
    enabled: true
    description: 运行质量评审回放、执行包构建、就绪度评估和整改规划
    stages:
      - diagnosis
      - mapping
      - stg
      - quality_rule_recommendation
      - review_replay
      - quality_review_replay
      - execution_package_build
      - readiness_assessment
      - gap_classification
      - remediation_planning
    supports_review_replay: true
    default_report_mode: readiness

  - name: full_governance_work_package
    enabled: true
    description: 构建完整治理就绪度与整改工作包
    stages:
      - diagnosis
      - mapping
      - stg
      - quality_rule_recommendation
      - review_replay
      - quality_review_replay
      - execution_package_build
      - readiness_assessment
      - gap_classification
      - remediation_planning
    supports_review_replay: true
    default_report_mode: remediation

  - name: governance_backlog_build
    enabled: true
    description: 运行就绪度评估、整改规划，并构建治理待办
    stages:
      - diagnosis
      - mapping
      - stg
      - quality_rule_recommendation
      - execution_package_build
      - readiness_assessment
      - gap_classification
      - remediation_planning
      - backlog_build
    supports_review_replay: false
    default_report_mode: backlog

  - name: governance_backlog_build_with_review
    enabled: true
    description: 运行评审回放、就绪度评估、整改规划和待办构建
    stages:
      - diagnosis
      - mapping
      - stg
      - quality_rule_recommendation
      - review_replay
      - quality_review_replay
      - execution_package_build
      - readiness_assessment
      - gap_classification
      - remediation_planning
      - backlog_build
    supports_review_replay: true
    default_report_mode: backlog

  - name: full_governance_backlog_package
    enabled: true
    description: 构建完整治理工作包和本地跟踪待办
    stages:
      - diagnosis
      - mapping
      - stg
      - quality_rule_recommendation
      - review_replay
      - quality_review_replay
      - execution_package_build
      - readiness_assessment
      - gap_classification
      - remediation_planning
      - backlog_build
    supports_review_replay: true
    default_report_mode: backlog

  - name: governance_portfolio_assessment
    enabled: true
    description: 运行待办构建、SLA 分析、组合汇总和进度快照
    stages:
      - diagnosis
      - mapping
      - stg
      - quality_rule_recommendation
      - execution_package_build
      - readiness_assessment
      - gap_classification
      - remediation_planning
      - backlog_build
      - backlog_sla
      - portfolio_aggregation
      - progress_snapshot
    supports_review_replay: false
    default_report_mode: portfolio

  - name: full_governance_portfolio_package
    enabled: true
    description: 构建包含 SLA、组合汇总和进度快照的完整治理待办包
    stages:
      - diagnosis
      - mapping
      - stg
      - quality_rule_recommendation
      - review_replay
      - quality_review_replay
      - execution_package_build
      - readiness_assessment
      - gap_classification
      - remediation_planning
      - backlog_build
      - backlog_sla
      - portfolio_aggregation
      - progress_snapshot
    supports_review_replay: true
    default_report_mode: portfolio

  - name: governance_delivery_package
    enabled: true
    description: 构建确认工作簿和本地治理交付包
    stages:
      - diagnosis
      - mapping
      - stg
      - quality_rule_recommendation
      - execution_package_build
      - readiness_assessment
      - gap_classification
      - remediation_planning
      - backlog_build
      - confirmation_workbook_export
      - delivery_package_build
    supports_review_replay: false
    default_report_mode: package

  - name: governance_delivery_package_with_review
    enabled: true
    description: 构建带评审回放的确认工作簿和本地治理交付包
    stages:
      - diagnosis
      - mapping
      - stg
      - quality_rule_recommendation
      - review_replay
      - quality_review_replay
      - execution_package_build
      - readiness_assessment
      - gap_classification
      - remediation_planning
      - backlog_build
      - confirmation_workbook_export
      - delivery_package_build
    supports_review_replay: true
    default_report_mode: package

  - name: confirmation_workbook_only
    enabled: true
    description: 导出映射、STG、质量规则和待办确认工作簿
    stages:
      - diagnosis
      - mapping
      - stg
      - quality_rule_recommendation
      - review_replay
      - quality_review_replay
      - execution_package_build
      - readiness_assessment
      - gap_classification
      - remediation_planning
      - backlog_build
      - confirmation_workbook_export
    supports_review_replay: true
    default_report_mode: workbook

  - name: batch_governance_run
    enabled: true
    description: 按配置字段分组运行多文件批处理治理
    stages:
      - batch_load
      - grouping
      - fingerprint
      - incremental_diff
      - rerun_scope_selection
      - governance_workflow
    supports_review_replay: true
    default_report_mode: batch

  - name: batch_incremental_rerun
    enabled: true
    description: 基于本地指纹快照仅重跑变更对象
    stages:
      - batch_load
      - grouping
      - fingerprint
      - incremental_diff
      - rerun_scope_selection
      - governance_workflow
    supports_review_replay: true
    default_report_mode: incremental

  - name: batch_delivery_package
    enabled: true
    description: 运行多文件批处理治理并构建交付包
    stages:
      - batch_load
      - grouping
      - fingerprint
      - incremental_diff
      - rerun_scope_selection
      - governance_workflow
      - delivery_package_build
    supports_review_replay: true
    default_report_mode: delivery

  - name: import_confirmation_workbook
    enabled: true
    description: 导入已填写确认工作簿并合并本地更新
    stages:
      - workbook_validate
      - workbook_import
      - roundtrip_merge
    supports_review_replay: false
    default_report_mode: import

  - name: import_and_rerun_changed_objects
    enabled: true
    description: 导入确认工作簿并准备变更对象重跑范围
    stages:
      - workbook_validate
      - workbook_import
      - roundtrip_merge
      - roundtrip_rerun
    supports_review_replay: false
    default_report_mode: rerun

  - name: mapping_only
    enabled: true
    description: 仅运行数据标准映射
    stages:
      - mapping
    supports_review_replay: false
    default_report_mode: mapping

  - name: stg_only_from_mapping
    enabled: true
    description: 运行映射和 STG 建议，不执行完整诊断打包
    stages:
      - mapping
      - stg
    supports_review_replay: false
    default_report_mode: stg

  - name: quality_only_from_stg
    enabled: true
    description: 运行映射、STG 建议和质量规则推荐，不执行完整诊断打包
    stages:
      - mapping
      - stg
      - quality_rule_recommendation
    supports_review_replay: false
    default_report_mode: quality

  - name: quality_only_from_stg_with_review
    enabled: true
    description: 运行映射、STG 建议、质量规则推荐和质量评审回放，不执行完整诊断打包
    stages:
      - mapping
      - stg
      - quality_rule_recommendation
      - quality_review_replay
    supports_review_replay: true
    default_report_mode: confirmed

  - name: quality_package_only_from_confirmed
    enabled: true
    description: 运行轻量质量评审链路并构建执行准备包
    stages:
      - mapping
      - stg
      - quality_rule_recommendation
      - quality_review_replay
      - execution_package_build
    supports_review_replay: true
    default_report_mode: package
