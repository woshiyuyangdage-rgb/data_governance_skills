tools:
  - name: run_governance_profile
    enabled: true
    description: 直接运行治理工作流方案
    input_model: GovernanceTaskRequest
    output_model: GovernanceTaskResponse
    handler: governance_tool_executor.run_governance_profile
    category: workflow

  - name: interpret_governance_intent
    enabled: true
    description: 将自然语言治理任务解析为结构化请求
    input_model: IntentTextRequest
    output_model: IntentExecutionResult
    handler: governance_tool_executor.interpret_governance_intent
    category: intent

  - name: preview_agent_plan
    enabled: true
    description: 仅预览执行计划，不实际运行
    input_model: AgentShellPlanRequest
    output_model: AgentShellResult
    handler: governance_tool_executor.preview_agent_plan
    category: agent_shell

  - name: run_agent_task
    enabled: true
    description: 解析任务、构建计划，并在策略允许时运行
    input_model: AgentShellRunRequest
    output_model: AgentShellResult
    handler: governance_tool_executor.run_agent_task
    category: agent_shell

  - name: resolve_governance_context
    enabled: true
    description: 解析会话上下文并预览执行计划
    input_model: AgentShellPlanRequest
    output_model: AgentShellResult
    handler: governance_tool_executor.resolve_governance_context
    category: context

  - name: export_governance_reports
    enabled: true
    description: 基于已有工作流结果导出治理报告
    input_model: ReportExportArguments
    output_model: dict
    handler: governance_tool_executor.export_governance_reports
    category: reporting

  - name: export_confirmation_workbooks
    enabled: true
    description: 导出映射、STG、质量规则和待办确认工作簿
    input_model: DeliveryPackageArguments
    output_model: dict
    handler: governance_tool_executor.export_confirmation_workbooks
    category: delivery

  - name: build_governance_delivery_package
    enabled: true
    description: 构建包含确认工作簿和清单的本地治理交付包
    input_model: DeliveryPackageArguments
    output_model: dict
    handler: governance_tool_executor.build_governance_delivery_package
    category: delivery

  - name: run_batch_governance
    enabled: true
    description: 按系统、schema 或领域提示分组运行多文件批处理治理
    input_model: BatchGovernanceArguments
    output_model: WorkflowResult
    handler: governance_tool_executor.run_batch_governance
    category: batch

  - name: run_incremental_rerun
    enabled: true
    description: 基于本地指纹快照仅重跑变更对象
    input_model: BatchGovernanceArguments
    output_model: WorkflowResult
    handler: governance_tool_executor.run_incremental_rerun
    category: batch

  - name: compare_governance_snapshots
    enabled: true
    description: 对比本地治理批处理快照并返回差异汇总
    input_model: BatchSnapshotCompareArguments
    output_model: dict
    handler: governance_tool_executor.compare_governance_snapshots
    category: batch

  - name: import_confirmation_workbook
    enabled: true
    description: 导入已填写确认工作簿并合并本地更新
    input_model: WorkbookImportArguments
    output_model: WorkflowResult
    handler: governance_tool_executor.import_confirmation_workbook
    category: delivery

  - name: import_confirmation_and_rerun
    enabled: true
    description: 导入确认工作簿并准备变更对象重跑范围
    input_model: WorkbookImportArguments
    output_model: WorkflowResult
    handler: governance_tool_executor.import_confirmation_and_rerun
    category: delivery

  - name: list_domain_governance_packs
    enabled: true
    description: 列出已启用的领域治理包
    input_model: EmptyArguments
    output_model: dict
    handler: governance_tool_executor.list_domain_governance_packs
    category: template

  - name: list_project_templates
    enabled: true
    description: 列出已启用的项目模板
    input_model: EmptyArguments
    output_model: dict
    handler: governance_tool_executor.list_project_templates
    category: template

  - name: match_domain_governance_pack
    enabled: true
    description: 根据元数据文本匹配领域治理包
    input_model: DomainPackMatchArguments
    output_model: DomainPackMatchResult
    handler: governance_tool_executor.match_domain_governance_pack
    category: template

  - name: run_project_template
    enabled: true
    description: 运行项目模板，可选择覆盖领域治理包
    input_model: ProjectTemplateRunArguments
    output_model: WorkflowResult
    handler: governance_tool_executor.run_project_template
    category: template

  - name: diagnose_metadata_intake_template
    enabled: true
    description: 诊断结构化元数据接入模板并输出匹配证据
    input_model: MetadataIntakeDiagnoseArguments
    output_model: IntakeMatchResult
    handler: governance_tool_executor.diagnose_metadata_intake_template
    category: intake

  - name: normalize_metadata_input
    enabled: true
    description: 将企业元数据接入文件规范化为标准元数据记录
    input_model: MetadataIntakeNormalizeArguments
    output_model: IntakeNormalizationResult
    handler: governance_tool_executor.normalize_metadata_input
    category: intake

  - name: run_governance_with_intake_profile
    enabled: true
    description: 通过接入配置规范化元数据并运行治理工作流
    input_model: GovernanceWithIntakeArguments
    output_model: WorkflowResult
    handler: governance_tool_executor.run_governance_with_intake_profile
    category: intake

  - name: diagnose_confirmation_template
    enabled: true
    description: 诊断确认工作簿模板并输出列映射证据
    input_model: ConfirmationTemplateDiagnoseArguments
    output_model: ConfirmationTemplateMatchResult
    handler: governance_tool_executor.diagnose_confirmation_template
    category: delivery

  - name: import_confirmation_with_template
    enabled: true
    description: 按模板字段映射导入确认工作簿
    input_model: ConfirmationTemplateImportArguments
    output_model: WorkflowResult
    handler: governance_tool_executor.import_confirmation_with_template
    category: delivery

  - name: recommend_quality_rules
    enabled: true
    description: 运行治理链路直到质量规则推荐
    input_model: QualityRuleToolRequest
    output_model: GovernanceTaskResponse
    handler: governance_tool_executor.recommend_quality_rules
    category: quality

  - name: recommend_quality_intelligence
    enabled: true
    description: 推荐字段级、领域感知和跨字段质量规则
    input_model: QualityRuleToolRequest
    output_model: GovernanceTaskResponse
    handler: governance_tool_executor.recommend_quality_intelligence
    category: quality

  - name: review_quality_rules
    enabled: true
    description: 评审质量规则建议并生成已确认质量规则
    input_model: QualityRuleReviewArguments
    output_model: dict
    handler: governance_tool_executor.review_quality_rules
    category: quality

  - name: batch_review_quality_rules
    enabled: true
    description: 根据简单筛选条件批量生成质量规则评审记录
    input_model: QualityBatchReviewArguments
    output_model: dict
    handler: governance_tool_executor.batch_review_quality_rules
    category: quality

  - name: export_confirmed_quality_rules
    enabled: true
    description: 将已确认质量规则导出为 JSON 包或 dbt tests YAML
    input_model: RuleExportArguments
    output_model: list
    handler: governance_tool_executor.export_confirmed_quality_rules
    category: quality

  - name: build_execution_ready_package
    enabled: true
    description: 基于已确认质量规则构建执行准备包
    input_model: ExecutionPackageBuildArguments
    output_model: dict
    handler: governance_tool_executor.build_execution_ready_package
    category: quality

  - name: export_execution_ready_package
    enabled: true
    description: 将执行准备包导出为 JSON、清单或 dbt YAML
    input_model: ExecutionPackageExportArguments
    output_model: list
    handler: governance_tool_executor.export_execution_ready_package
    category: quality

  - name: assess_rag_quality
    enabled: true
    description: 评估 RAG 知识库的文档、切片、检索、回答和权限质量
    input_model: RagQualityAssessmentArguments
    output_model: dict
    handler: governance_tool_executor.assess_rag_quality
    category: knowledge

  - name: assess_text_to_sql_readiness
    enabled: true
    description: 评估表元数据对 Text-to-SQL 选表、选字段、关联、指标、枚举和安全的准备度
    input_model: TextToSqlReadinessAssessmentArguments
    output_model: dict
    handler: governance_tool_executor.assess_text_to_sql_readiness
    category: governance

  - name: assess_governance_readiness
    enabled: true
    description: 基于工作流输出评估就绪度并分类治理缺口
    input_model: GovernanceReadinessAssessmentArguments
    output_model: dict
    handler: governance_tool_executor.assess_governance_readiness
    category: governance

  - name: build_governance_work_package
    enabled: true
    description: 构建整改动作和可导出的治理工作包
    input_model: GovernanceWorkPackageArguments
    output_model: dict
    handler: governance_tool_executor.build_governance_work_package
    category: governance

  - name: build_governance_backlog
    enabled: true
    description: 根据整改动作构建本地治理待办
    input_model: GovernanceBacklogBuildArguments
    output_model: dict
    handler: governance_tool_executor.build_governance_backlog
    category: governance

  - name: update_governance_backlog_status
    enabled: true
    description: 更新一个已持久化治理待办的状态
    input_model: GovernanceBacklogStatusUpdateArguments
    output_model: BacklogUpdateResult
    handler: governance_tool_executor.update_governance_backlog_status
    category: governance

  - name: list_governance_backlog_items
    enabled: true
    description: 列出已持久化治理待办，支持可选筛选
    input_model: GovernanceBacklogListArguments
    output_model: dict
    handler: governance_tool_executor.list_governance_backlog_items
    category: governance

  - name: assess_governance_portfolio
    enabled: true
    description: 评估待办 SLA 状态和治理组合汇总
    input_model: GovernancePortfolioAssessmentArguments
    output_model: dict
    handler: governance_tool_executor.assess_governance_portfolio
    category: governance

  - name: generate_progress_snapshot
    enabled: true
    description: 生成并可选保存本地治理进度快照
    input_model: ProgressSnapshotArguments
    output_model: dict
    handler: governance_tool_executor.generate_progress_snapshot
    category: governance

  - name: list_governance_progress_snapshots
    enabled: true
    description: 列出已保存的本地治理进度快照
    input_model: dict
    output_model: dict
    handler: governance_tool_executor.list_governance_progress_snapshots
    category: governance

  - name: list_delivery_template_profiles
    enabled: true
    description: 列出已启用的企业交付模板和交付包变体
    input_model: dict
    output_model: dict
    handler: governance_tool_executor.list_delivery_template_profiles
    category: delivery

  - name: list_config_assets
    enabled: true
    description: 列出受管治理配置资产
    input_model: dict
    output_model: list
    handler: governance_tool_executor.list_config_assets
    category: control_plane

  - name: get_config_asset
    enabled: true
    description: 获取一个受管治理配置资产及其当前内容
    input_model: ConfigAssetLookupRequest
    output_model: dict
    handler: governance_tool_executor.get_config_asset
    category: control_plane

  - name: validate_config_asset
    enabled: true
    description: 校验一个受管治理配置资产
    input_model: ConfigAssetLookupRequest
    output_model: ValidationResult
    handler: governance_tool_executor.validate_config_asset
    category: control_plane

  - name: save_config_asset
    enabled: true
    description: 校验后保存一个受管治理配置资产
    input_model: ConfigAssetSaveRequest
    output_model: ConfigEditResult
    handler: governance_tool_executor.save_config_asset
    category: control_plane

  - name: publish_config_asset
    enabled: true
    description: 发布一个受管治理配置资产
    input_model: ConfigAssetLookupRequest
    output_model: ConfigEditResult
    handler: governance_tool_executor.publish_config_asset
    category: control_plane
